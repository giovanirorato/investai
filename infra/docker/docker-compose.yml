services:
  postgres:
    image: postgres:16-alpine
    container_name: investai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investai}
      POSTGRES_DB: ${POSTGRES_DB:-investai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - investai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-investai} -d $${POSTGRES_DB:-investai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  investai-postgres-data:
